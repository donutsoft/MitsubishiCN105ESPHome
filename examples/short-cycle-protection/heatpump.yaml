# Send fresh room measurements in Celsius through the existing API service.
api:
  reboot_timeout: 0s
  services:
    - service: set_remote_temperature
      variables:
        temperature: float
      then:
        - lambda: 'id(heatpump).set_remote_temperature(temperature);'
climate:
- id: heatpump
  name: Heat pump
  platform: cn105
  remote_temperature_keepalive_interval: 20s
  remote_temperature_timeout: 120s
  uart_id: hp_uart
  short_cycle_protection_switch:
    name: Short cycle protection
esp32:
  board: esp32dev
  framework:
    type: esp-idf
esphome:
  name: short-cycle-test
external_components:
- components:
  - cn105
  source:
    path: ../../components
    type: local
logger:
  baud_rate: 0
uart:
  baud_rate: 2400
  id: hp_uart
  parity: EVEN
  rx_pin: GPIO16
  tx_pin: GPIO17
wifi:
  password: replace-with-your-password
  ssid: replace-with-your-ssid
